name: Release installers

# Builds real Windows + Linux installers with electron-builder and
# attaches them to the GitHub release. Runs on every v* tag.
# Free for public repos; uses free Linux/Windows CI minutes on private ones.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: '--win nsis portable'
          - os: ubuntu-latest
            targets: '--linux AppImage deb'
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds — no certs needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Package web app into desktop shell
        run: node desktop/sync.js

      - name: Build installers
        working-directory: desktop
        run: npx electron-builder ${{ matrix.targets }}

      - name: Upload installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*
          generate_release_notes: false
          fail_on_unmatched_files: true
