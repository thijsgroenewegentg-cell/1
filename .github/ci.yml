# /.github/ci.yml  →  run "bash scripts/enable_ci.sh" to activate it
#
# GitHub only runs workflows under .github/workflows/, and it rejects pushes
# from an app without the `workflows` permission — hence this staging spot and
# the one-line script that moves it.
#
# Continuous integration: ruff, mypy, the pytest unit suite and the offline
# smoke suite on Linux, macOS and Windows, plus a combined coverage run.
# Everything here is free GitHub-hosted CI — no model downloads, no secrets,
# no paid services. Nothing in it needs Ollama: tests/mock_ollama.py stands in
# for the model, so a run takes minutes rather than gigabytes.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML httpx rich psutil python-dateutil numpy
          pip install ruff mypy pytest pytest-cov coverage types-PyYAML
          pip install chromadb ddgs beautifulsoup4 feedparser pypdf || echo "optional extras unavailable, continuing"
          pip install fastapi "uvicorn[standard]" || echo "web extras unavailable, continuing"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy

      - name: Byte-compile every module
        run: python -m compileall -q core interfaces modules utils tests main.py install.py

      - name: Check the installer's own help output
        run: python install.py --help

      - name: Syntax-check the web interface script
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path("interfaces/app.html").read_text(encoding="utf-8")
          js = "\n".join(re.findall(r"<script>(.*?)</script>", html, re.S))
          pathlib.Path("app_extracted.js").write_text(js, encoding="utf-8")
          print("extracted", len(js), "characters of interface script")
          PY
          node --check app_extracted.js

      - name: Run the unit tests
        run: pytest

      - name: Run the offline smoke suite
        run: python tests/test_smoke.py

      - name: Verify the CLI answers without an LLM
        shell: bash
        run: |
          python main.py --no-voice --say "what time is it" | tee reply.txt
          test -s reply.txt

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML httpx rich psutil python-dateutil numpy pytest coverage
          pip install chromadb ddgs beautifulsoup4 feedparser pypdf || true
          pip install fastapi "uvicorn[standard]" || true
      - name: Measure both suites together
        run: |
          coverage run tests/test_smoke.py
          coverage run -m pytest -q
          coverage combine
          coverage report
          coverage xml
      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build a wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the built artefacts
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dist
          path: dist/*
          if-no-files-found: error
