<!doctype html>
<!-- /interfaces/app.html
     The browser interface. Kept as a real file rather than a Python string so
     it can be edited, linted and read like the document it is; web.py loads it
     and substitutes __TITLE__ and __TOKEN_QUERY__.
     Everything is inline and offline: no CDN, no fonts to fetch, no tracking. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<link rel="manifest" href="/manifest.webmanifest__TOKEN_QUERY__">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>__TITLE__</title>
<style>
:root {
  --bg: #070b11;
  --bg-soft: #0c121b;
  --panel: rgba(18, 25, 36, .82);
  --panel-solid: #121924;
  --line: #1c2634;
  --line-soft: #161f2b;
  --text: #e8eef6;
  --dim: #8698ad;
  --dimmer: #5c6b7e;
  --accent: #38bdf8;
  --accent-deep: #0284c7;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #f87171;
  --user: linear-gradient(135deg, #1d4ed8, #2563eb);
  --radius: 16px;
  --shadow: 0 18px 40px rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15.5px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
  display: flex;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 500px at 78% -8%, rgba(56, 189, 248, .10), transparent 65%),
    radial-gradient(700px 420px at 8% 105%, rgba(37, 99, 235, .09), transparent 60%);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #1e2937; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: #2a3a4d; background-clip: content-box; }

/* ---------------------------------------------------------------- shell */
#shell { display: flex; width: 100%; height: 100%; position: relative; z-index: 1; }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 18px; padding-top: calc(12px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--line-soft);
  background: linear-gradient(180deg, rgba(12, 18, 27, .96), rgba(12, 18, 27, .72));
  backdrop-filter: blur(14px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand h1 {
  margin: 0; font-size: 15px; letter-spacing: .22em; font-weight: 600;
  text-transform: uppercase; white-space: nowrap;
}
.reactor { width: 30px; height: 30px; flex: none; }
.reactor circle { transform-origin: center; }
.reactor .ring { fill: none; stroke: var(--accent); stroke-width: 7; opacity: .85; }
.reactor .core { fill: var(--accent); }
.reactor .halo { fill: none; stroke: var(--accent); stroke-width: 4; opacity: .25; }
body.busy .reactor .halo { animation: expand 1.4s ease-out infinite; }
body.busy .reactor .core { animation: throb 1.4s ease-in-out infinite; }
@keyframes expand { from { r: 28; opacity: .5; } to { r: 46; opacity: 0; } }
@keyframes throb { 50% { opacity: .45; } }

.pills { display: flex; gap: 7px; margin-left: auto; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; color: var(--dim);
  background: rgba(10, 15, 22, .6); white-space: nowrap;
}
.pill b { color: var(--text); font-weight: 500; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
.pill .dot.on { background: var(--good); box-shadow: 0 0 8px rgba(52, 211, 153, .7); }
.pill .dot.warn { background: var(--warn); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line);
  color: var(--dim); display: grid; place-items: center; flex: none;
  transition: background .15s, color .15s, border-color .15s;
}
.icon-btn:hover { background: rgba(56, 189, 248, .1); color: var(--accent); border-color: var(--accent-deep); }
.icon-btn.active { background: rgba(56, 189, 248, .16); color: var(--accent); border-color: var(--accent-deep); }

/* ------------------------------------------------------------ transcript */
#log {
  flex: 1; overflow-y: auto; padding: 26px 18px 8px;
  display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
}
.turn { display: flex; flex-direction: column; gap: 6px; max-width: 780px; width: 100%; margin: 0 auto; }
.turn.me { align-items: flex-end; }
.bubble {
  max-width: 86%; padding: 12px 15px; border-radius: var(--radius);
  overflow-wrap: anywhere; animation: rise .22s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.me .bubble { background: var(--user); border-bottom-right-radius: 5px; color: #fff; }
.ai .bubble {
  background: var(--panel); border: 1px solid var(--line);
  border-bottom-left-radius: 5px; backdrop-filter: blur(8px); box-shadow: var(--shadow);
}
.ai.pending .bubble::after {
  content: "▍"; color: var(--accent); animation: blink 1.05s steps(1) infinite; margin-left: 1px;
}
@keyframes blink { 50% { opacity: 0; } }
.sys { align-self: center; max-width: 640px; }
.sys .bubble {
  background: rgba(18, 25, 36, .55); border: 1px dashed var(--line);
  color: var(--dim); font-size: 14px; text-align: center;
}
.meta-row { display: flex; gap: 10px; align-items: center; font-size: 11.5px; color: var(--dimmer); padding: 0 4px; }
.turn.me .meta-row { flex-direction: row-reverse; }
.meta-row button { color: var(--dimmer); font-size: 11.5px; padding: 2px 4px; border-radius: 6px; }
.meta-row button:hover { color: var(--accent); background: rgba(56, 189, 248, .08); }

.bubble p { margin: 0 0 10px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
.bubble li { margin: 3px 0; }
.bubble h3 { font-size: 15px; margin: 12px 0 6px; color: var(--accent); }
.bubble a { color: var(--accent); }
.bubble code {
  background: rgba(0, 0, 0, .45); padding: 1.5px 6px; border-radius: 6px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 90%;
}
.code {
  position: relative; margin: 10px 0; border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; background: #060a10;
}
.code header {
  all: unset; display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: #0a1119; border-bottom: 1px solid var(--line);
  font-size: 11px; color: var(--dimmer); letter-spacing: .08em; text-transform: uppercase;
}
.code pre { margin: 0; padding: 12px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
.code .copy { font-size: 11px; color: var(--dim); padding: 2px 8px; border-radius: 6px; }
.code .copy:hover { color: var(--accent); background: rgba(56, 189, 248, .1); }

/* ------------------------------------------------------- activity trace */
.trace {
  border-left: 2px solid var(--line); margin: 2px 0 0 4px; padding: 2px 0 2px 12px;
  display: flex; flex-direction: column; gap: 3px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dimmer);
}
.trace div { animation: rise .2s ease-out; }
.trace .k { color: var(--accent); }
.trace .t { color: var(--dim); }

/* ---------------------------------------------------------- empty state */
#welcome { margin: auto; max-width: 720px; text-align: center; padding: 20px; }
#welcome .big { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 6px; }
#welcome .sub { color: var(--dim); margin-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.card {
  text-align: left; border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px;
  background: rgba(18, 25, 36, .5); transition: transform .15s, border-color .15s, background .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent-deep); background: rgba(56, 189, 248, .07); }
.card b { display: block; font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.card span { color: var(--dim); font-size: 12.5px; }

/* ---------------------------------------------------------------- composer */
footer {
  border-top: 1px solid var(--line-soft); padding: 12px 18px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(0deg, rgba(12, 18, 27, .97), rgba(12, 18, 27, .8));
  backdrop-filter: blur(14px);
}
.composer { max-width: 780px; margin: 0 auto; }
.field {
  display: flex; gap: 9px; align-items: flex-end; padding: 7px 7px 7px 14px;
  border: 1px solid var(--line); border-radius: 18px; background: rgba(7, 11, 17, .85);
  transition: border-color .15s, box-shadow .15s;
}
.field:focus-within { border-color: var(--accent-deep); box-shadow: 0 0 0 4px rgba(56, 189, 248, .08); }
textarea {
  flex: 1; resize: none; border: 0; background: none; outline: none;
  min-height: 26px; max-height: 180px; padding: 6px 0; line-height: 1.5;
}
textarea::placeholder { color: var(--dimmer); }
.send {
  width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center;
  background: var(--accent); color: #04121c; transition: opacity .15s, transform .1s;
}
.send:hover { transform: translateY(-1px); }
.send:disabled { opacity: .35; transform: none; cursor: default; }
.mic {
  width: 40px; height: 40px; border-radius: 13px; flex: none; border: 1px solid var(--line);
  color: var(--dim); display: grid; place-items: center; position: relative; overflow: hidden;
}
.mic:hover { color: var(--accent); border-color: var(--accent-deep); }
.mic.recording { background: #ef4444; border-color: #ef4444; color: #fff; }
.mic .level {
  position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, .35);
  height: 0%; transition: height .06s linear; pointer-events: none;
}
.mic.busy { opacity: .5; }
.chips { display: flex; gap: 7px; margin-top: 9px; flex-wrap: wrap; align-items: center; }
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
  color: var(--dim); font-size: 12.5px; transition: color .15s, border-color .15s, background .15s;
}
.chip:hover { color: var(--accent); border-color: var(--accent-deep); background: rgba(56, 189, 248, .07); }
.chip.on { color: var(--accent); border-color: var(--accent-deep); background: rgba(56, 189, 248, .12); }
.hint { margin-left: auto; font-size: 11.5px; color: var(--dimmer); }

/* -------------------------------------------------------------- side panel */
aside {
  width: 330px; flex: none; border-left: 1px solid var(--line-soft);
  background: var(--panel-solid); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s ease, margin .22s ease;
  margin-right: -330px;
}
body.panel-open aside { transform: none; margin-right: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line-soft); padding: 8px 8px 0; gap: 4px; }
.tab {
  padding: 8px 12px; font-size: 13px; color: var(--dim); border-radius: 9px 9px 0 0;
  border: 1px solid transparent; border-bottom: 0;
}
.tab.on { color: var(--text); background: rgba(56, 189, 248, .08); border-color: var(--line); }
.panes { flex: 1; overflow-y: auto; padding: 14px; }
.pane { display: none; flex-direction: column; gap: 12px; }
.pane.on { display: flex; }
.stat { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.stat span:first-child { color: var(--dim); }
.stat span:last-child { text-align: right; overflow-wrap: anywhere; }
.section-title { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dimmer); margin-top: 6px; }
.tool {
  border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; text-align: left; width: 100%;
  transition: border-color .15s, background .15s;
}
.tool:hover { border-color: var(--accent-deep); background: rgba(56, 189, 248, .07); }
.tool b { display: block; font-size: 13px; font-weight: 600; }
.tool span { font-size: 12px; color: var(--dim); }
#toolSearch, .panes input {
  width: 100%; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line);
  background: rgba(7, 11, 17, .8); outline: none; font-size: 13.5px;
}
#toolSearch:focus { border-color: var(--accent-deep); }
.audit { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; display: flex; flex-direction: column; gap: 6px; }
.audit div { display: flex; gap: 8px; border-bottom: 1px solid var(--line-soft); padding-bottom: 5px; }
.audit .w { color: var(--dimmer); flex: none; }
.audit .allowed { color: var(--good); }
.audit .confirmed { color: var(--accent); }
.audit .declined, .audit .blocked { color: var(--bad); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 7px 0; }
.switch button { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 12px; color: var(--dim); }
.switch button.on { color: var(--accent); border-color: var(--accent-deep); background: rgba(56, 189, 248, .12); }

/* ------------------------------------------------------------------ misc */
#toBottom {
  position: absolute; right: 24px; bottom: 122px; width: 38px; height: 38px;
  border-radius: 50%; background: var(--panel-solid); border: 1px solid var(--line);
  color: var(--dim); display: none; place-items: center; box-shadow: var(--shadow); z-index: 5;
}
#toBottom.show { display: grid; }
#toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--panel-solid); border: 1px solid var(--line); border-left: 3px solid var(--accent);
  border-radius: 11px; padding: 9px 14px; font-size: 13.5px; box-shadow: var(--shadow);
  animation: drop .2s ease-out;
}
.toast.bad { border-left-color: var(--bad); }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

@media (max-width: 820px) {
  aside { position: fixed; inset: 0 0 0 auto; width: min(330px, 88vw); z-index: 20; margin-right: 0; box-shadow: var(--shadow); }
  body.panel-open::after { content: ""; position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 10; }
  #log { padding: 18px 12px 8px; }
  footer { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .brand h1 { font-size: 13px; letter-spacing: .16em; }
  .pill.wide { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div id="shell">
  <main>
    <header>
      <div class="brand">
        <svg class="reactor" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="halo" cx="50" cy="50" r="28"></circle>
          <circle class="ring" cx="50" cy="50" r="30"></circle>
          <circle class="core" cx="50" cy="50" r="12"></circle>
        </svg>
        <h1>__TITLE__</h1>
      </div>
      <div class="pills">
        <span class="pill"><span class="dot" id="dot"></span><span id="state">connecting</span></span>
        <span class="pill wide" id="pillModel" hidden>model <b id="model">—</b></span>
        <span class="pill wide" id="pillMemory" hidden>memory <b id="memory">—</b></span>
        <span class="pill" id="pillTiming" hidden><b id="timing"></b></span>
        <button class="icon-btn" id="panelToggle" title="Status, tools and audit (Ctrl+K)" aria-label="Toggle the side panel">☰</button>
      </div>
    </header>

    <div id="log" role="log" aria-live="polite">
      <div id="welcome">
        <div class="big">Good day, sir.</div>
        <div class="sub">Everything runs on this machine. Ask, or pick somewhere to start.</div>
        <div class="cards">
          <button class="card" data-say="What time is it?"><b>The basics</b><span>time, system stats, disk space</span></button>
          <button class="card" data-say="Add oat milk to my todo list"><b>Keep track</b><span>todos, reminders, timers, notes</span></button>
          <button class="card" data-say="Convert -12 celsius to fahrenheit"><b>Work it out</b><span>maths, units, translation</span></button>
          <button class="card" data-say="Show me your own code map"><b>Look inward</b><span>its own source, plugins, changes</span></button>
        </div>
      </div>
    </div>
    <button id="toBottom" title="Jump to the latest" aria-label="Scroll to the newest message">↓</button>

    <footer>
      <div class="composer">
        <form class="field" id="form">
          <textarea id="input" rows="1" placeholder="Ask me something, sir…" autocomplete="off" aria-label="Message"></textarea>
          <button class="mic" id="mic" type="button" title="Hold to talk" aria-label="Hold to talk">
            <span class="level" id="level"></span>🎙
          </button>
          <button class="send" id="send" type="submit" title="Send (Enter)" aria-label="Send">➤</button>
        </form>
        <div class="chips">
          <button class="chip" type="button" data-say="How's the weather?">weather</button>
          <button class="chip" type="button" data-say="Give me my daily briefing">briefing</button>
          <button class="chip" type="button" data-say="What's on my todo list?">todos</button>
          <button class="chip" type="button" data-say="System stats">system</button>
          <button class="chip" id="speech" type="button" title="Read replies aloud">🔊 speech</button>
          <button class="chip" id="stop" type="button" title="Stop the current reply (Esc)">■ stop</button>
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
        </div>
      </div>
    </footer>
  </main>

  <aside aria-label="Status, tools and audit">
    <div class="tabs">
      <button class="tab on" data-pane="status">Status</button>
      <button class="tab" data-pane="tools">Tools</button>
      <button class="tab" data-pane="audit">Audit</button>
    </div>
    <div class="panes">
      <div class="pane on" id="pane-status">
        <div class="section-title">Assistant</div>
        <div id="statusList"></div>
        <div class="section-title">This session</div>
        <div class="stat"><span>Turns</span><span id="statTurns">0</span></div>
        <div class="stat"><span>Last reply</span><span id="statLast">—</span></div>
        <div class="section-title">Settings</div>
        <div class="switch"><span>Read replies aloud</span><button id="setSpeech">off</button></div>
        <div class="switch"><span>Keep this conversation</span><button id="setKeep" class="on">on</button></div>
        <div class="switch"><span>Clear the transcript</span><button id="setClear">clear</button></div>
      </div>
      <div class="pane" id="pane-tools">
        <input id="toolSearch" placeholder="Search 100+ tools…" aria-label="Search tools">
        <div id="toolList" style="display:flex;flex-direction:column;gap:7px"></div>
      </div>
      <div class="pane" id="pane-audit">
        <div class="section-title">What needed permission</div>
        <div class="audit" id="auditList"></div>
        <button class="chip" id="auditRefresh" style="align-self:flex-start">refresh</button>
      </div>
    </div>
  </aside>
</div>
<div id="toasts" aria-live="assertive"></div>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const auth = token ? "?token=" + encodeURIComponent(token) : "";
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), dot = $("dot"), state = $("state");

let socket = null, pending = null, pendingTrace = null, busy = false;
let turns = 0, retry = 0;
const settings = {
  speech: localStorage.getItem("jarvis.speech") === "1",
  keep: localStorage.getItem("jarvis.keep") !== "0",
};

/* ------------------------------------------------------------- rendering */
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function renderMarkdown(text) {
  const blocks = [];
  let out = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang: lang || "text", code: code.replace(/\n$/, "") });
    return "\u0000BLOCK" + (blocks.length - 1) + "\u0000";
  });
  out = escapeHtml(out);
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/^###?\s+(.+)$/gm, "<h3>$1</h3>");

  const lines = out.split("\n");
  const html = [];
  let list = null;
  for (const line of lines) {
    const bullet = line.match(/^\s*[-•*]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || number) {
      const kind = bullet ? "ul" : "ol";
      if (list !== kind) { if (list) html.push("</" + list + ">"); html.push("<" + kind + ">"); list = kind; }
      html.push("<li>" + (bullet ? bullet[1] : number[1]) + "</li>");
    } else {
      if (list) { html.push("</" + list + ">"); list = null; }
      if (line.trim() === "") html.push("");
      else if (line.startsWith("<h3>")) html.push(line);
      else html.push("<p>" + line + "</p>");
    }
  }
  if (list) html.push("</" + list + ">");

  return html.join("").replace(/\u0000BLOCK(\d+)\u0000/g, (m, index) => {
    const block = blocks[index];
    return '<div class="code"><header><span>' + escapeHtml(block.lang) +
      '</span><button class="copy" type="button">copy</button></header><pre>' +
      escapeHtml(block.code) + "</pre></div>";
  });
}

function timeNow() {
  return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function addTurn(kind, text, options = {}) {
  $("welcome")?.remove();
  const wrap = document.createElement("div");
  wrap.className = "turn " + kind;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = renderMarkdown(text || "");
  wrap.appendChild(bubble);

  if (kind !== "sys") {
    const meta = document.createElement("div");
    meta.className = "meta-row";
    meta.innerHTML = "<span>" + timeNow() + "</span>";
    const copy = document.createElement("button");
    copy.textContent = "copy";
    copy.onclick = () => {
      navigator.clipboard?.writeText(wrap.dataset.text || bubble.innerText);
      toast("Copied.");
    };
    meta.appendChild(copy);
    if (kind === "ai") {
      const say = document.createElement("button");
      say.textContent = "speak";
      say.onclick = () => speak(wrap.dataset.text || bubble.innerText);
      meta.appendChild(say);
    }
    if (kind === "me") {
      const again = document.createElement("button");
      again.textContent = "again";
      again.onclick = () => send(wrap.dataset.text || bubble.innerText);
      meta.appendChild(again);
    }
    wrap.appendChild(meta);
  }
  wrap.dataset.text = text || "";
  log.appendChild(wrap);
  scrollDown();
  save();
  return wrap;
}

function scrollDown(force) {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 160;
  if (near || force) log.scrollTop = log.scrollHeight;
}

function toast(text, bad) {
  const node = document.createElement("div");
  node.className = "toast" + (bad ? " bad" : "");
  node.textContent = text;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), 3600);
}

/* ------------------------------------------------------- activity trace */
function traceLine(label, detail) {
  if (!pending) return;
  if (!pendingTrace) {
    pendingTrace = document.createElement("div");
    pendingTrace.className = "trace";
    pending.insertBefore(pendingTrace, pending.firstChild);
  }
  const row = document.createElement("div");
  row.innerHTML = '<span class="k">' + escapeHtml(label) + '</span> <span class="t">' +
    escapeHtml(detail) + "</span>";
  pendingTrace.appendChild(row);
  scrollDown();
}

/* -------------------------------------------------------------- socket */
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(scheme + "://" + location.host + "/ws" + auth);

  socket.onopen = () => {
    dot.classList.add("on"); state.textContent = "connected"; retry = 0;
  };
  socket.onclose = () => {
    dot.classList.remove("on"); state.textContent = "reconnecting";
    setBusy(false);
    retry = Math.min(retry + 1, 6);
    setTimeout(connect, 400 * retry);
  };
  socket.onerror = () => { state.textContent = "connection error"; };
  socket.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); } catch (err) { return; }
    handle(data);
  };
}

function handle(data) {
  if (data.type === "token") {
    if (!pending) { pending = addTurn("ai", ""); pending.classList.add("pending"); }
    pending.dataset.text = (pending.dataset.text || "") + data.text;
    pending.querySelector(".bubble").innerHTML = renderMarkdown(pending.dataset.text);
    scrollDown();
  } else if (data.type === "reply") {
    const text = data.text || (pending && pending.dataset.text) || "";
    if (pending) {
      pending.classList.remove("pending");
      pending.dataset.text = text;
      pending.querySelector(".bubble").innerHTML = renderMarkdown(text);
    } else {
      addTurn("ai", text);
    }
    pending = null; pendingTrace = null;
    setBusy(false);
    turns += 1;
    $("statTurns").textContent = turns;
    if (data.intent || data.seconds) {
      const timing = (data.intent || "answer") + " · " + (data.seconds || 0).toFixed(1) + "s";
      $("timing").textContent = timing;
      $("pillTiming").hidden = false;
      $("statLast").textContent = timing;
    }
    if (settings.speech && text) speak(text);
    save();
  } else if (data.type === "event") {
    if (data.name === "turn.intent") traceLine("route", (data.data.module || "?") +
      "  " + (data.data.method || ""));
    else if (data.name === "tool.called") traceLine("tool", data.data.tool || "?");
    else if (data.name === "error.raised") traceLine("error", data.data.error || "");
  } else if (data.type === "status") {
    state.textContent = data.text;
  } else if (data.type === "notice") {
    addTurn("sys", "🔔 " + data.text);
    if (settings.speech && data.text) speak(data.text);
    if (window.Notification && Notification.permission === "granted") {
      try { new Notification("JARVIS", { body: data.text }); } catch (err) { /* denied */ }
    }
  } else if (data.type === "error") {
    toast(data.text, true);
    addTurn("sys", "⚠ " + data.text);
    pending = null; pendingTrace = null; setBusy(false);
  }
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  document.body.classList.toggle("busy", value);
  if (!value && state.textContent === "thinking") state.textContent = "connected";
}

function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  if (!socket || socket.readyState !== 1) { toast("Not connected yet.", true); return; }
  addTurn("me", text);
  socket.send(JSON.stringify({ text }));
  setBusy(true);
  state.textContent = "thinking";
  input.value = ""; input.style.height = "auto";
}

function speak(text) {
  const audio = new Audio("/api/tts?text=" + encodeURIComponent(text.slice(0, 900)) +
    (token ? "&token=" + encodeURIComponent(token) : ""));
  audio.play().catch(() => toast("Speech is not available on the server.", true));
}

/* ------------------------------------------------------------ persistence */
function save() {
  if (!settings.keep) return;
  const items = [...log.querySelectorAll(".turn")].slice(-40).map((node) => ({
    kind: node.className.replace("turn ", "").replace(" pending", ""),
    text: node.dataset.text || "",
  }));
  try { sessionStorage.setItem("jarvis.log", JSON.stringify(items)); } catch (err) { /* full */ }
}

function restore() {
  if (!settings.keep) return;
  let items = [];
  try { items = JSON.parse(sessionStorage.getItem("jarvis.log") || "[]"); } catch (err) { return; }
  items.forEach((item) => item.text && addTurn(item.kind, item.text));
}

/* ------------------------------------------------------------- side panel */
function togglePanel(force) {
  const open = force === undefined ? !document.body.classList.contains("panel-open") : force;
  document.body.classList.toggle("panel-open", open);
  $("panelToggle").classList.toggle("active", open);
  if (open) { loadStatus(); loadTools(); }
}

async function loadStatus() {
  try {
    const data = await (await fetch("/api/status" + auth)).json();
    const llm = data.llm || {}, memory = data.memory || {};
    $("model").textContent = llm.model || "offline";
    $("memory").textContent = memory.backend || "—";
    $("pillModel").hidden = false; $("pillMemory").hidden = false;
    const rows = [
      ["Model", (llm.model || "not running") + (llm.available === false ? " (offline)" : "")],
      ["Host", llm.host || "—"],
      ["Memory", (memory.backend || "—") + " · " + (memory.long_term ?? memory.entries ?? 0) + " facts"],
      ["Modules", (data.modules || []).length + " loaded"],
      ["Voice", data.voice ? "ready" : "not on this machine"],
      ["Uptime", data.uptime || "—"],
    ];
    $("statusList").innerHTML = rows.map(([k, v]) =>
      '<div class="stat"><span>' + escapeHtml(k) + "</span><span>" + escapeHtml(String(v)) +
      "</span></div>").join("");
  } catch (err) { /* the panel simply stays empty */ }
}

let toolCache = null;
async function loadTools() {
  if (toolCache) return drawTools();
  try {
    toolCache = await (await fetch("/api/tools" + auth)).json();
  } catch (err) { toolCache = { tools: [] }; }
  drawTools();
}

function drawTools() {
  const query = $("toolSearch").value.trim().toLowerCase();
  const tools = (toolCache.tools || []).filter((tool) =>
    !query || tool.name.toLowerCase().includes(query) ||
    (tool.description || "").toLowerCase().includes(query) ||
    (tool.module || "").toLowerCase().includes(query));
  $("toolSearch").placeholder = "Search " + (toolCache.tools || []).length + " tools…";
  $("toolList").innerHTML = tools.slice(0, 80).map((tool) =>
    '<button class="tool" data-example="' + escapeHtml(tool.example || tool.name.replace(/_/g, " ")) +
    '"><b>' + escapeHtml(tool.module + "." + tool.name) + "</b><span>" +
    escapeHtml(tool.description || "") + "</span></button>").join("") ||
    '<span style="color:var(--dim);font-size:13px">Nothing matches that.</span>';
  $("toolList").querySelectorAll(".tool").forEach((node) =>
    node.addEventListener("click", () => {
      input.value = node.dataset.example;
      input.focus();
      if (window.innerWidth <= 820) togglePanel(false);
    }));
}

async function loadAudit() {
  const list = $("auditList");
  list.innerHTML = '<span style="color:var(--dim)">reading…</span>';
  try {
    const data = await (await fetch("/api/audit" + auth)).json();
    const entries = data.entries || [];
    list.innerHTML = entries.length ? entries.reverse().map((entry) =>
      '<div><span class="w">' + escapeHtml((entry.at || "").slice(5, 16).replace("T", " ")) +
      '</span><span class="' + escapeHtml(entry.outcome || "") + '">' +
      escapeHtml(entry.outcome || "") + "</span><span>" +
      escapeHtml(entry.action || "") + "</span></div>").join("")
      : '<span style="color:var(--dim)">Nothing has needed permission.</span>';
  } catch (err) {
    list.innerHTML = '<span style="color:var(--dim)">Not available.</span>';
  }
}

/* ------------------------------------------------------------ push to talk */
let recorder = null, chunks = [], recording = false, meter = null;

async function startRecording() {
  if (recording) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    toast("This browser will not give me a microphone.", true); return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    toast("Microphone refused: " + err.message, true); return;
  }
  chunks = [];
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"]
    .find((type) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) || "";
  recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = () => finishRecording(stream);
  recorder.start();
  recording = true;
  $("mic").classList.add("recording");
  state.textContent = "listening";
  startMeter(stream);
}

function startMeter(stream) {
  try {
    const context = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = context.createAnalyser();
    analyser.fftSize = 512;
    context.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    meter = setInterval(() => {
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (const value of data) peak = Math.max(peak, Math.abs(value - 128));
      $("level").style.height = Math.min(100, (peak / 128) * 260) + "%";
    }, 60);
    recorder.addEventListener("stop", () => context.close().catch(() => {}), { once: true });
  } catch (err) { /* a meter is a luxury */ }
}

async function finishRecording(stream) {
  stream.getTracks().forEach((track) => track.stop());
  clearInterval(meter);
  $("level").style.height = "0%";
  const mic = $("mic");
  mic.classList.remove("recording");
  if (!chunks.length) { state.textContent = "connected"; return; }
  mic.classList.add("busy");
  state.textContent = "transcribing";
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  try {
    const response = await fetch("/api/listen" + auth, {
      method: "POST", body: blob, headers: { "Content-Type": blob.type || "audio/webm" },
    });
    const data = await response.json();
    if (!response.ok || data.error) toast(data.detail || data.error || "Transcription failed.", true);
    else if (!data.text) toast("I heard nothing, sir.");
    else send(data.text);
  } catch (err) {
    toast(err.message, true);
  } finally {
    mic.classList.remove("busy");
    if (state.textContent === "transcribing") state.textContent = "connected";
  }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  try { recorder.stop(); } catch (err) { /* already stopped */ }
}

/* ----------------------------------------------------------------- wiring */
$("form").addEventListener("submit", (event) => { event.preventDefault(); send(input.value); });
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(input.value); }
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") { $("stop").click(); }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault(); togglePanel();
  }
  if (event.key === "/" && document.activeElement !== input) { event.preventDefault(); input.focus(); }
});
$("stop").addEventListener("click", () => {
  if (socket && socket.readyState === 1) socket.send(JSON.stringify({ command: "cancel" }));
  setBusy(false);
});
document.addEventListener("click", (event) => {
  const say = event.target.closest("[data-say]");
  if (say) send(say.dataset.say);
  const copy = event.target.closest(".code .copy");
  if (copy) {
    navigator.clipboard?.writeText(copy.closest(".code").querySelector("pre").innerText);
    copy.textContent = "copied"; setTimeout(() => (copy.textContent = "copy"), 1400);
  }
});
log.addEventListener("scroll", () => {
  const away = log.scrollHeight - log.scrollTop - log.clientHeight > 260;
  $("toBottom").classList.toggle("show", away);
});
$("toBottom").addEventListener("click", () => scrollDown(true));
$("panelToggle").addEventListener("click", () => togglePanel());
$("toolSearch").addEventListener("input", drawTools);
$("auditRefresh").addEventListener("click", loadAudit);
document.querySelectorAll(".tab").forEach((tab) =>
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((other) => other.classList.remove("on"));
    document.querySelectorAll(".pane").forEach((pane) => pane.classList.remove("on"));
    tab.classList.add("on");
    $("pane-" + tab.dataset.pane).classList.add("on");
    if (tab.dataset.pane === "audit") loadAudit();
    if (tab.dataset.pane === "tools") loadTools();
  }));

const micButton = $("mic");
micButton.addEventListener("pointerdown", (event) => { event.preventDefault(); startRecording(); });
["pointerup", "pointerleave", "pointercancel"].forEach((name) =>
  micButton.addEventListener(name, (event) => { event.preventDefault(); stopRecording(); }));

function paintSpeech() {
  $("speech").classList.toggle("on", settings.speech);
  $("setSpeech").textContent = settings.speech ? "on" : "off";
  $("setSpeech").classList.toggle("on", settings.speech);
}
function toggleSpeech() {
  settings.speech = !settings.speech;
  localStorage.setItem("jarvis.speech", settings.speech ? "1" : "0");
  paintSpeech();
  if (settings.speech && window.Notification && Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}
$("speech").addEventListener("click", toggleSpeech);
$("setSpeech").addEventListener("click", toggleSpeech);
$("setKeep").addEventListener("click", () => {
  settings.keep = !settings.keep;
  localStorage.setItem("jarvis.keep", settings.keep ? "1" : "0");
  $("setKeep").textContent = settings.keep ? "on" : "off";
  $("setKeep").classList.toggle("on", settings.keep);
  if (!settings.keep) sessionStorage.removeItem("jarvis.log");
});
$("setClear").addEventListener("click", () => {
  log.querySelectorAll(".turn").forEach((node) => node.remove());
  sessionStorage.removeItem("jarvis.log");
  turns = 0; $("statTurns").textContent = "0";
  toast("Transcript cleared.");
});

paintSpeech();
$("setKeep").textContent = settings.keep ? "on" : "off";
$("setKeep").classList.toggle("on", settings.keep);
restore();
connect();
loadStatus();
setInterval(loadStatus, 30000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
