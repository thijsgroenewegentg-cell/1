name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check app.js && node --check sw.js && node --check desktop/main.js
      - name: Run test suite (40 checks)
        run: node tests/smoke.js
