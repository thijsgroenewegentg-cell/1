<!doctype html>
<!-- /interfaces/app.html
     The browser interface: a voice-first console built around a dot-matrix
     sphere that reacts to speech and thought. Kept as a real file rather than
     a Python string so it can be edited and linted; web.py loads it and
     substitutes __TITLE__ and __TOKEN_QUERY__.
     Everything is inline and offline: no CDN, no fonts to fetch, no tracking. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03060c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<link rel="manifest" href="/manifest.webmanifest__TOKEN_QUERY__">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<title>__TITLE__</title>
<style>
:root {
  --bg: #03060c;
  --text: #dbe7f5;
  --dim: #7b8da3;
  --dimmer: #46566b;
  --line: rgba(120, 160, 220, .16);
  --idle: #3b56d8;
  --listen: #22d3ee;
  --think: #8b5cf6;
  --speak: #38bdf8;
  --bad: #f87171;
  --good: #34d399;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
body {
  color: var(--text); font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, "Roboto Mono", monospace; }

/* the sphere fills the screen; everything else floats over it */
#orb { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#vignette {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(circle at 50% 46%, transparent 30%, rgba(3, 6, 12, .55) 72%, #03060c 100%);
}

/* ------------------------------------------------------------- modules */
#tiles {
  position: fixed; top: 22px; left: 22px; z-index: 3;
  display: grid; grid-template-columns: repeat(4, 15px); gap: 6px;
}
.tile {
  width: 15px; height: 15px; border-radius: 4px; background: rgba(120, 160, 220, .11);
  border: 1px solid rgba(120, 160, 220, .16); transition: background .25s, box-shadow .25s, transform .25s;
}
.tile.lit {
  background: var(--listen); border-color: var(--listen);
  box-shadow: 0 0 14px rgba(34, 211, 238, .8); transform: scale(1.18);
}
.tile.off { opacity: .3; }
#tileLabel {
  position: fixed; top: 92px; left: 22px; z-index: 3; font-size: 10.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--dimmer); height: 14px; transition: color .2s;
}

/* -------------------------------------------------------------- header */
#top {
  position: fixed; top: 20px; left: 0; right: 0; z-index: 3;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  pointer-events: none; font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
  color: var(--dimmer);
}
#top b { color: var(--text); font-weight: 500; letter-spacing: .34em; }
#link { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
#link.on { background: var(--good); box-shadow: 0 0 9px rgba(52, 211, 153, .8); }

/* -------------------------------------------------------------- caption */
#stage {
  position: fixed; inset: auto 0 0 0; top: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  padding: 0 24px 190px; pointer-events: none;
}
#state {
  font-size: 11px; letter-spacing: .38em; text-transform: uppercase; color: var(--listen);
  height: 16px; opacity: 0; transition: opacity .3s;
}
#state.show { opacity: 1; }
#caption {
  max-width: 720px; text-align: center; font-size: 22px; line-height: 1.45; font-weight: 400;
  margin-top: 14px; text-shadow: 0 2px 30px rgba(3, 6, 12, .95); pointer-events: auto;
  max-height: 34vh; overflow-y: auto; scrollbar-width: none;
}
#caption::-webkit-scrollbar { display: none; }
#caption.dim { color: var(--dim); font-size: 17px; }
#caption .cursor { color: var(--speak); animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#caption code {
  font-family: ui-monospace, monospace; font-size: 88%;
  background: rgba(120, 160, 220, .12); padding: 1px 6px; border-radius: 6px;
}
#caption pre {
  text-align: left; font-size: 12.5px; background: rgba(6, 12, 22, .85);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow-x: auto;
}

/* ----------------------------------------------------------- transcript */
#rail {
  position: fixed; top: 0; right: 0; bottom: 0; width: 290px; z-index: 3;
  padding: 78px 22px 200px; display: flex; flex-direction: column; justify-content: flex-end;
  gap: 9px; pointer-events: none; mask-image: linear-gradient(180deg, transparent, #000 22%, #000 88%, transparent);
}
.line { font-size: 11.5px; line-height: 1.5; text-align: right; animation: slide .3s ease-out; }
@keyframes slide { from { opacity: 0; transform: translateX(10px); } }
.line.me { color: var(--text); }
.line.ai { color: var(--dim); }
.line.trace { color: var(--dimmer); letter-spacing: .04em; }
.line.trace b { color: var(--listen); font-weight: 400; }
.line.sys { color: var(--dimmer); font-style: italic; }
.line.err { color: var(--bad); }

/* -------------------------------------------------------------- console */
#dock {
  position: fixed; left: 50%; bottom: 42px; transform: translateX(-50%); z-index: 4;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-bottom: env(safe-area-inset-bottom);
}
.controls {
  display: flex; align-items: center; gap: 10px; padding: 9px;
  border: 1px solid var(--line); border-radius: 999px;
  background: rgba(8, 14, 26, .72); backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
}
.round {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
  color: var(--dim); border: 1px solid transparent; transition: color .18s, background .18s, border-color .18s;
}
.round:hover { color: var(--text); background: rgba(120, 160, 220, .1); }
.round.on { color: var(--listen); border-color: rgba(34, 211, 238, .5); background: rgba(34, 211, 238, .1); }
.round svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7;
             stroke-linecap: round; stroke-linejoin: round; }
#mic {
  width: 58px; height: 58px; color: var(--text);
  background: radial-gradient(circle at 50% 35%, rgba(59, 86, 216, .5), rgba(8, 14, 26, .9));
  border: 1px solid rgba(120, 160, 220, .3);
}
#mic svg { width: 23px; height: 23px; }
#mic.recording {
  color: #fff; border-color: var(--listen);
  background: radial-gradient(circle at 50% 35%, rgba(34, 211, 238, .55), rgba(8, 14, 26, .9));
  box-shadow: 0 0 0 6px rgba(34, 211, 238, .12), 0 0 34px rgba(34, 211, 238, .45);
}
#mic.busy { opacity: .45; }
#typed {
  display: none; align-items: center; gap: 8px; width: min(560px, 88vw);
  border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 16px;
  background: rgba(8, 14, 26, .82); backdrop-filter: blur(16px);
}
#typed.show { display: flex; }
#typed input { flex: 1; border: 0; background: none; outline: none; padding: 9px 0; }
#typed input::placeholder { color: var(--dimmer); }
#typed button { color: var(--listen); padding: 0 10px; }
.hint { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--dimmer); }

/* ---------------------------------------------------------------- panel */
#panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); z-index: 6;
  background: rgba(6, 11, 20, .96); border-left: 1px solid var(--line); backdrop-filter: blur(20px);
  transform: translateX(100%); transition: transform .26s ease; display: flex; flex-direction: column;
}
body.panel-open #panel { transform: none; }
.tabs { display: flex; gap: 4px; padding: 14px 12px 0; border-bottom: 1px solid var(--line); }
.tab { padding: 8px 12px; font-size: 12.5px; color: var(--dimmer); border-radius: 8px 8px 0 0; }
.tab.on { color: var(--text); background: rgba(120, 160, 220, .1); }
.panes { flex: 1; overflow-y: auto; padding: 16px; }
.pane { display: none; flex-direction: column; gap: 10px; }
.pane.on { display: flex; }
.stat { display: flex; justify-content: space-between; gap: 14px; font-size: 13px; padding: 6px 0;
        border-bottom: 1px solid var(--line); }
.stat span:first-child { color: var(--dimmer); }
.stat span:last-child { text-align: right; overflow-wrap: anywhere; }
.head { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dimmer); margin-top: 8px; }
#toolSearch {
  width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: rgba(3, 6, 12, .8); outline: none; font-size: 13px;
}
.tool { border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; text-align: left; width: 100%; }
.tool:hover { border-color: rgba(34, 211, 238, .45); background: rgba(34, 211, 238, .06); }
.tool b { display: block; font-size: 12.5px; font-weight: 500; }
.tool span { font-size: 11.5px; color: var(--dimmer); }
.audit { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; }
.audit div { display: flex; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
.audit .allowed { color: var(--good); } .audit .confirmed { color: var(--listen); }
.audit .declined, .audit .blocked { color: var(--bad); }
.switch { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; }
.switch button { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 11.5px;
                 color: var(--dimmer); }
.switch button.on { color: var(--listen); border-color: rgba(34, 211, 238, .5); }

#toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 20;
          display: flex; flex-direction: column; gap: 8px; }
.toast { background: rgba(8, 14, 26, .95); border: 1px solid var(--line); border-left: 2px solid var(--listen);
         border-radius: 10px; padding: 9px 14px; font-size: 13px; animation: slide .2s ease-out; }
.toast.bad { border-left-color: var(--bad); }

@media (max-width: 820px) {
  #rail { display: none; }
  #stage { padding-bottom: 210px; }
  #caption { font-size: 19px; }
  #tiles { top: 16px; left: 16px; }
  #tileLabel { top: 84px; left: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<canvas id="orb"></canvas>
<div id="vignette"></div>

<div id="top"><span id="link"></span><b>__TITLE__</b><span id="topState">connecting</span></div>

<div id="tiles" title="Modules — they light up when used"></div>
<div id="tileLabel"></div>

<div id="stage">
  <div id="state"></div>
  <div id="caption" class="dim">Hold the button, or press <b>space</b>, and speak.</div>
</div>

<div id="rail" aria-live="polite"></div>

<div id="dock">
  <div id="typed">
    <input id="input" placeholder="Type instead…" autocomplete="off" aria-label="Message">
    <button id="sendBtn" title="Send" aria-label="Send">↵</button>
  </div>
  <div class="controls">
    <button class="round" id="keyboard" title="Type instead (T)" aria-label="Type instead">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
    </button>
    <button class="round" id="mic" title="Hold to talk (space)" aria-label="Hold to talk">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="round" id="speech" title="Read replies aloud" aria-label="Read replies aloud">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg>
    </button>
    <button class="round" id="panelBtn" title="Status, tools, audit (Ctrl+K)" aria-label="Open the panel">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">hold space to speak · T to type · Esc to stop</div>
</div>

<div id="panel" aria-label="Status, tools and audit">
  <div class="tabs">
    <button class="tab on" data-pane="status">Status</button>
    <button class="tab" data-pane="tools">Tools</button>
    <button class="tab" data-pane="audit">Audit</button>
  </div>
  <div class="panes">
    <div class="pane on" id="pane-status">
      <div class="head">Assistant</div><div id="statusList"></div>
      <div class="head">Session</div>
      <div class="stat"><span>Turns</span><span id="statTurns">0</span></div>
      <div class="stat"><span>Last reply</span><span id="statLast">—</span></div>
      <div class="head">Settings</div>
      <div class="switch"><span>Read replies aloud</span><button id="setSpeech">off</button></div>
      <div class="switch"><span>Clear the transcript</span><button id="setClear">clear</button></div>
    </div>
    <div class="pane" id="pane-tools">
      <input id="toolSearch" placeholder="Search tools…" aria-label="Search tools">
      <div id="toolList" style="display:flex;flex-direction:column;gap:7px"></div>
    </div>
    <div class="pane" id="pane-audit">
      <div class="head">What needed permission</div>
      <div class="audit" id="auditList"></div>
      <button class="tool" id="auditRefresh" style="width:auto;align-self:flex-start">refresh</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="assertive"></div>

<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const auth = token ? "?token=" + encodeURIComponent(token) : "";
const $ = (id) => document.getElementById(id);
const rail = $("rail"), caption = $("caption"), input = $("input");

let socket = null, busy = false, replyText = "", turns = 0, retry = 0;
let captionTimer = null;
const settings = { speech: localStorage.getItem("jarvis.speech") === "1" };

/* =======================================================================
   The sphere. Points on a Fibonacci lattice, rotated and projected by hand;
   its radius, colour and jitter follow whatever JARVIS is doing.
   ===================================================================== */
const canvas = $("orb"), ctx = canvas.getContext("2d");
const POINTS = window.innerWidth < 760 ? 1500 : 3200;
const sphere = [];
for (let i = 0; i < POINTS; i++) {
  const y = 1 - (i / (POINTS - 1)) * 2;
  const radius = Math.sqrt(Math.max(0, 1 - y * y));
  const theta = i * Math.PI * (3 - Math.sqrt(5));
  sphere.push({ x: Math.cos(theta) * radius, y, z: Math.sin(theta) * radius });
}

const orb = {
  energy: 0,        // 0 idle … 1 loud
  target: 0,
  hue: "idle",      // idle | listen | think | speak
  spin: 0,
  time: 0,
};
const COLOURS = {
  idle:   [59, 86, 216],
  listen: [34, 211, 238],
  think:  [139, 92, 246],
  speak:  [56, 189, 248],
};
let paint = COLOURS.idle.slice();

function resize() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * ratio);
  canvas.height = Math.floor(innerHeight * ratio);
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
addEventListener("resize", resize);
resize();

function draw() {
  const width = innerWidth, height = innerHeight;
  const centreX = width / 2;
  const centreY = height * (width < 760 ? 0.40 : 0.44);
  const base = Math.min(width, height) * (width < 760 ? 0.30 : 0.26);

  orb.time += 0.016;
  orb.energy += (orb.target - orb.energy) * 0.12;
  orb.spin += 0.0016 + orb.energy * 0.007;

  const wanted = COLOURS[orb.hue] || COLOURS.idle;
  for (let i = 0; i < 3; i++) paint[i] += (wanted[i] - paint[i]) * 0.06;
  const [red, green, blue] = paint.map(Math.round);

  ctx.clearRect(0, 0, width, height);

  // a soft glow behind the points
  const glow = ctx.createRadialGradient(centreX, centreY, base * 0.1, centreX, centreY, base * 2.1);
  glow.addColorStop(0, `rgba(${red},${green},${blue},${0.10 + orb.energy * 0.16})`);
  glow.addColorStop(1, "rgba(3,6,12,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);

  const breathe = 1 + Math.sin(orb.time * 1.1) * 0.012 + orb.energy * 0.07;
  const cosine = Math.cos(orb.spin), sine = Math.sin(orb.spin);
  const tilt = Math.sin(orb.time * 0.22) * 0.16;

  for (let i = 0; i < sphere.length; i++) {
    const point = sphere[i];
    // spin about Y, then a gentle tilt about X
    let x = point.x * cosine - point.z * sine;
    let z = point.x * sine + point.z * cosine;
    let y = point.y * Math.cos(tilt) - z * Math.sin(tilt);
    z = point.y * Math.sin(tilt) + z * Math.cos(tilt);

    // a shallow travelling ripple, so it breathes rather than deforms
    const wobble = 1 + orb.energy * 0.045 *
      Math.sin(point.y * 6 + orb.time * 4.2 + point.x * 3);
    const radius = base * breathe * wobble;

    const depth = (z + 1) / 2;                       // 0 far … 1 near
    const scale = 0.74 + depth * 0.44;               // simple perspective
    const screenX = centreX + x * radius * scale;
    const screenY = centreY + y * radius * scale;

    // Depth for solidity, plus a rim term so the silhouette stays crisp —
    // without it the shell reads as a fog rather than a surface.
    const rim = Math.pow(1 - Math.abs(z), 3);
    const alpha = 0.07 + depth * depth * (0.45 + orb.energy * 0.32) + rim * 0.34;
    const size = (0.5 + depth * 1.15 + rim * 0.5) * (1 + orb.energy * 0.22);
    ctx.fillStyle = `rgba(${red},${green},${blue},${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(screenX, screenY, size, 0, 6.2832);
    ctx.fill();
  }

  // a bright core that pulses with the energy
  const core = ctx.createRadialGradient(centreX, centreY, 0, centreX, centreY, base * 0.42);
  core.addColorStop(0, `rgba(255,255,255,${0.03 + orb.energy * 0.13})`);
  core.addColorStop(0.5, `rgba(${red},${green},${blue},${0.04 + orb.energy * 0.09})`);
  core.addColorStop(1, "rgba(3,6,12,0)");
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(centreX, centreY, base * 0.5, 0, 6.2832);
  ctx.fill();

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function mood(hue, energy) {
  orb.hue = hue;
  orb.target = energy;
}

/* ------------------------------------------------------------- captions */
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function light(text) {
  let html = escapeHtml(text);
  html = html.replace(/```(?:\w*)\n?([\s\S]*?)```/g, (m, code) => "<pre>" + code.trim() + "</pre>");
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return html.replace(/\n/g, "<br>");
}

function say(text, options = {}) {
  clearTimeout(captionTimer);
  caption.classList.toggle("dim", Boolean(options.dim));
  caption.innerHTML = light(text) + (options.cursor ? '<span class="cursor">▍</span>' : "");
  caption.scrollTop = caption.scrollHeight;
  if (options.fade) {
    captionTimer = setTimeout(() => {
      caption.classList.add("dim");
      caption.innerHTML = "Hold the button, or press <b>space</b>, and speak.";
    }, options.fade);
  }
}

function status(text) {
  $("state").textContent = text;
  $("state").classList.toggle("show", Boolean(text));
}

function trace(kind, text) {
  const line = document.createElement("div");
  line.className = "line " + kind;
  line.innerHTML = text;
  rail.appendChild(line);
  while (rail.children.length > 14) rail.firstChild.remove();
}

function toast(text, bad) {
  const node = document.createElement("div");
  node.className = "toast" + (bad ? " bad" : "");
  node.textContent = text;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), 3800);
}

/* -------------------------------------------------------- module tiles */
const MODULES = ["system_control", "web_search", "productivity", "code_assistant",
                 "file_manager", "smart_assistant", "knowledge", "vision",
                 "blender", "communications", "models", "self_improve"];
const tiles = {};
MODULES.forEach((name) => {
  const tile = document.createElement("div");
  tile.className = "tile off";
  tile.title = name.replace(/_/g, " ");
  $("tiles").appendChild(tile);
  tiles[name] = tile;
});

function lightTile(name) {
  const tile = tiles[name];
  if (!tile) return;
  tile.classList.add("lit");
  $("tileLabel").textContent = name.replace(/_/g, " ");
  setTimeout(() => tile.classList.remove("lit"), 1300);
  setTimeout(() => { if ($("tileLabel").textContent === name.replace(/_/g, " ")) $("tileLabel").textContent = ""; }, 2600);
}

/* -------------------------------------------------------------- socket */
function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  socket = new WebSocket(scheme + "://" + location.host + "/ws" + auth);
  socket.onopen = () => {
    $("link").classList.add("on"); $("topState").textContent = "online"; retry = 0;
    mood("idle", 0);
  };
  socket.onclose = () => {
    $("link").classList.remove("on"); $("topState").textContent = "reconnecting";
    setBusy(false); retry = Math.min(retry + 1, 6);
    setTimeout(connect, 400 * retry);
  };
  socket.onerror = () => { $("topState").textContent = "link error"; };
  socket.onmessage = (event) => {
    let data; try { data = JSON.parse(event.data); } catch (err) { return; }
    handle(data);
  };
}

function handle(data) {
  if (data.type === "token") {
    replyText += data.text;
    say(replyText, { cursor: true });
    mood("speak", 0.5);
  } else if (data.type === "reply") {
    replyText = data.text || replyText;
    say(replyText || "…", { fade: 26000 });
    trace("ai", escapeHtml(replyText.slice(0, 150)));
    setBusy(false);
    turns += 1; $("statTurns").textContent = turns;
    if (data.intent || data.seconds) {
      const summary = (data.intent || "answer") + " · " + (data.seconds || 0).toFixed(1) + "s";
      $("statLast").textContent = summary;
    }
    if (settings.speech && replyText) speakAloud(replyText);
  } else if (data.type === "event") {
    if (data.name === "turn.intent") {
      lightTile(data.data.module);
      trace("trace", "<b>route</b> " + escapeHtml(data.data.module || "?"));
      status("routing");
    } else if (data.name === "tool.called") {
      const tool = String(data.data.tool || "");
      lightTile(tool.split(".")[0]);
      trace("trace", "<b>tool</b> " + escapeHtml(tool));
      status("working");
      mood("think", 0.62);
    } else if (data.name === "error.raised") {
      trace("err", escapeHtml(String(data.data.error || "").slice(0, 90)));
    }
  } else if (data.type === "status") {
    status(data.text);
  } else if (data.type === "notice") {
    trace("sys", "🔔 " + escapeHtml(data.text));
    say(data.text, { fade: 20000 });
    if (settings.speech) speakAloud(data.text);
    if (window.Notification && Notification.permission === "granted") {
      try { new Notification("JARVIS", { body: data.text }); } catch (err) { /* denied */ }
    }
  } else if (data.type === "error") {
    toast(data.text, true); trace("err", escapeHtml(data.text)); setBusy(false);
  }
}

function setBusy(value) {
  busy = value;
  if (value) { mood("think", 0.55); status("thinking"); }
  else { mood("idle", 0); status(""); }
}

function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  if (!socket || socket.readyState !== 1) { toast("Not connected yet.", true); return; }
  trace("me", escapeHtml(text));
  say(text, { dim: true });
  replyText = "";
  socket.send(JSON.stringify({ text }));
  setBusy(true);
  input.value = "";
}

function speakAloud(text) {
  const audio = new Audio("/api/tts?text=" + encodeURIComponent(text.slice(0, 900)) +
    (token ? "&token=" + encodeURIComponent(token) : ""));
  audio.play().catch(() => toast("No speech engine on the server.", true));
}

/* ------------------------------------------------------- hold to speak */
let recorder = null, chunks = [], recording = false, meter = null, context = null;

async function startRecording() {
  if (recording || busy) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    toast("This browser will not give me a microphone.", true); return;
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { toast("Microphone refused: " + err.message, true); return; }

  chunks = [];
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"]
    .find((type) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) || "";
  recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  recorder.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
  recorder.onstop = () => finishRecording(stream);
  recorder.start();
  recording = true;
  $("mic").classList.add("recording");
  status("listening");
  say("Listening…", { dim: true });
  mood("listen", 0.25);
  meterFrom(stream);
}

function meterFrom(stream) {
  try {
    context = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = context.createAnalyser();
    analyser.fftSize = 512;
    context.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    meter = setInterval(() => {
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (const value of data) peak = Math.max(peak, Math.abs(value - 128));
      mood("listen", Math.min(1, (peak / 128) * 3.4));   // the sphere follows your voice
    }, 45);
  } catch (err) { /* the meter is a luxury */ }
}

async function finishRecording(stream) {
  stream.getTracks().forEach((track) => track.stop());
  clearInterval(meter);
  if (context) { context.close().catch(() => {}); context = null; }
  $("mic").classList.remove("recording");
  if (!chunks.length) { mood("idle", 0); status(""); return; }
  $("mic").classList.add("busy");
  status("transcribing");
  mood("think", 0.4);
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
  try {
    const response = await fetch("/api/listen" + auth, {
      method: "POST", body: blob, headers: { "Content-Type": blob.type || "audio/webm" },
    });
    const data = await response.json();
    if (!response.ok || data.error) {
      toast(data.detail || data.error || "Transcription failed.", true);
      mood("idle", 0); status("");
    } else if (!data.text) {
      say("I heard nothing, sir.", { dim: true, fade: 4000 }); mood("idle", 0); status("");
    } else {
      send(data.text);
    }
  } catch (err) {
    toast(err.message, true); mood("idle", 0); status("");
  } finally {
    $("mic").classList.remove("busy");
  }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  try { recorder.stop(); } catch (err) { /* already stopped */ }
}

/* ------------------------------------------------------------ the panel */
function togglePanel(force) {
  const open = force === undefined ? !document.body.classList.contains("panel-open") : force;
  document.body.classList.toggle("panel-open", open);
  $("panelBtn").classList.toggle("on", open);
  if (open) { loadStatus(); loadTools(); }
}

async function loadStatus() {
  try {
    const data = await (await fetch("/api/status" + auth)).json();
    const llm = data.llm || {}, memory = data.memory || {};
    const loaded = (data.modules || []).map((m) => (typeof m === "string" ? m : m.name));
    MODULES.forEach((name) => tiles[name].classList.toggle("off", !loaded.includes(name)));
    const rows = [
      ["Model", (llm.model || "not running") + (llm.available === false ? " · offline" : "")],
      ["Host", llm.host || "—"],
      ["Memory", (memory.backend || "—") + " · " + (memory.long_term ?? memory.entries ?? 0) + " facts"],
      ["Modules", loaded.length + " loaded"],
      ["Uptime", data.uptime || "—"],
    ];
    $("statusList").innerHTML = rows.map(([key, value]) =>
      '<div class="stat"><span>' + escapeHtml(key) + "</span><span>" +
      escapeHtml(String(value)) + "</span></div>").join("");
  } catch (err) { /* the panel simply stays empty */ }
}

let toolCache = null;
async function loadTools() {
  if (!toolCache) {
    try { toolCache = await (await fetch("/api/tools" + auth)).json(); }
    catch (err) { toolCache = { tools: [] }; }
  }
  drawTools();
}

function drawTools() {
  const query = $("toolSearch").value.trim().toLowerCase();
  const all = toolCache.tools || [];
  $("toolSearch").placeholder = "Search " + all.length + " tools…";
  const shown = all.filter((tool) => !query || (tool.name + tool.module + (tool.description || ""))
    .toLowerCase().includes(query));
  $("toolList").innerHTML = shown.slice(0, 60).map((tool) =>
    '<button class="tool" data-example="' + escapeHtml(tool.example || tool.name.replace(/_/g, " ")) +
    '"><b>' + escapeHtml(tool.module + "." + tool.name) + "</b><span>" +
    escapeHtml(tool.description || "") + "</span></button>").join("") ||
    '<span style="color:var(--dimmer);font-size:12px">Nothing matches.</span>';
  $("toolList").querySelectorAll(".tool").forEach((node) =>
    node.addEventListener("click", () => {
      showTyped(true); input.value = node.dataset.example; input.focus(); togglePanel(false);
    }));
}

async function loadAudit() {
  const list = $("auditList");
  list.innerHTML = '<span style="color:var(--dimmer)">reading…</span>';
  try {
    const data = await (await fetch("/api/audit" + auth)).json();
    const entries = (data.entries || []).reverse();
    list.innerHTML = entries.length ? entries.map((entry) =>
      '<div><span style="color:var(--dimmer)">' +
      escapeHtml((entry.at || "").slice(5, 16).replace("T", " ")) + '</span><span class="' +
      escapeHtml(entry.outcome || "") + '">' + escapeHtml(entry.outcome || "") +
      "</span><span>" + escapeHtml((entry.action || "").slice(0, 60)) + "</span></div>").join("")
      : '<span style="color:var(--dimmer)">Nothing has needed permission.</span>';
  } catch (err) {
    list.innerHTML = '<span style="color:var(--dimmer)">Not available.</span>';
  }
}

/* ----------------------------------------------------------------- wiring */
function showTyped(show) {
  $("typed").classList.toggle("show", show);
  $("keyboard").classList.toggle("on", show);
  if (show) input.focus();
}

$("keyboard").addEventListener("click", () => showTyped(!$("typed").classList.contains("show")));
$("sendBtn").addEventListener("click", () => send(input.value));
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); send(input.value); }
  if (event.key === "Escape") { showTyped(false); }
});

const mic = $("mic");
mic.addEventListener("pointerdown", (event) => { event.preventDefault(); startRecording(); });
["pointerup", "pointerleave", "pointercancel"].forEach((name) =>
  mic.addEventListener(name, (event) => { event.preventDefault(); stopRecording(); }));

let spaceHeld = false;
addEventListener("keydown", (event) => {
  const typing = document.activeElement === input || document.activeElement === $("toolSearch");
  if (event.code === "Space" && !typing && !spaceHeld) {
    event.preventDefault(); spaceHeld = true; startRecording();
  }
  if (event.key === "Escape") {
    if (socket && socket.readyState === 1) socket.send(JSON.stringify({ command: "cancel" }));
    setBusy(false); say("Stopped.", { dim: true, fade: 3000 });
  }
  if (!typing && event.key.toLowerCase() === "t") { event.preventDefault(); showTyped(true); }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault(); togglePanel();
  }
});
addEventListener("keyup", (event) => {
  if (event.code === "Space" && spaceHeld) { spaceHeld = false; stopRecording(); }
});

$("panelBtn").addEventListener("click", () => togglePanel());
$("toolSearch").addEventListener("input", drawTools);
$("auditRefresh").addEventListener("click", loadAudit);
document.querySelectorAll(".tab").forEach((tab) =>
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((other) => other.classList.remove("on"));
    document.querySelectorAll(".pane").forEach((pane) => pane.classList.remove("on"));
    tab.classList.add("on"); $("pane-" + tab.dataset.pane).classList.add("on");
    if (tab.dataset.pane === "audit") loadAudit();
    if (tab.dataset.pane === "tools") loadTools();
  }));

function paintSpeech() {
  $("speech").classList.toggle("on", settings.speech);
  $("setSpeech").textContent = settings.speech ? "on" : "off";
  $("setSpeech").classList.toggle("on", settings.speech);
}
function toggleSpeech() {
  settings.speech = !settings.speech;
  localStorage.setItem("jarvis.speech", settings.speech ? "1" : "0");
  paintSpeech();
  if (settings.speech && window.Notification && Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}
$("speech").addEventListener("click", toggleSpeech);
$("setSpeech").addEventListener("click", toggleSpeech);
$("setClear").addEventListener("click", () => {
  rail.innerHTML = ""; turns = 0; $("statTurns").textContent = "0";
  say("Hold the button, or press <b>space</b>, and speak.", { dim: true });
  toast("Cleared.");
});

paintSpeech();
connect();
loadStatus();
setInterval(loadStatus, 30000);
fetch("/api/status" + auth).then((response) => response.json())
  .then((data) => { if (data.greeting) say(data.greeting, { fade: 18000 }); })
  .catch(() => {});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
