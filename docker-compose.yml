version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: jarvis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile:/Modelfile
    restart: unless-stopped
    # Uncomment for GPU (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: bash -c "ollama serve & sleep 5 && ollama pull qwen2.5:7b && ollama create jarvis -f /Modelfile 2>/dev/null || true && wait"

  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./.env:/app/.env
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=jarvis
    restart: unless-stopped

volumes:
  ollama_data:
