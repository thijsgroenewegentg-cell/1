# /pyproject.toml
# Packaging metadata. Installing the project is optional — `python main.py`
# always works — but `pip install -e .` gives you a global `jarvis` command.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "1.1.0"
description = "A 100% free, fully local JARVIS-style personal AI assistant (Ollama + Whisper + Edge-TTS + ChromaDB)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JARVIS project" }]
keywords = ["assistant", "ollama", "whisper", "voice", "local-ai", "rag", "jarvis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install stays small: everything heavy is optional.
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "psutil>=5.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Everything the full assistant uses, minus the audio stack.
core = [
    "chromadb>=0.5",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pandas>=2.0",
]
voice = [
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "webrtcvad>=2.0.10",
    "pvporcupine>=3.0",
    "openwakeword>=0.6",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
vision = [
    "pillow>=10.0",
]
all = [
    "jarvis-local[core,voice,web,vision]",
]
dev = [
    "pyflakes>=3.2",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/thijsgroenewegentg-cell/1"
Issues = "https://github.com/thijsgroenewegentg-cell/1/issues"

[project.scripts]
jarvis = "main:main"

[tool.setuptools]
# A flat layout of top-level packages plus the single-module entry point.
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "interfaces*", "modules*", "utils*"]
exclude = ["tests*", "data*", "logs*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
