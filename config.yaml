user:
  name: Thijs
  title: sir
  location: auto
  units: metric
assistant:
  name: JARVIS
  language: en
  personality: witty
  sarcasm: 0.35
  greet_on_start: true
  proactive: true
llm:
  provider: ollama
  host: http://localhost:11434
  model: llama3.2
  fallback_models:
  - mistral
  - llama3
  - llama3.1
  - phi3
  - qwen2.5
  temperature: 0.7
  top_p: 0.9
  num_ctx: 4096
  max_tokens: 700
  timeout: 180
  keep_alive: 10m
  stream: true
  retries: 2
  retry_backoff: 0.75
  warm_up: true
  router_model: ''
memory:
  enabled: true
  short_term_limit: 20
  long_term: true
  path: data/chroma
  collection: jarvis_memory
  embedding_model: nomic-embed-text
  top_k: 4
  min_relevance: 0.2
  autosave: true
  auto_extract_facts: true
  summarize: true
  summary_trigger: 12
  context_char_budget: 9000
database:
  path: data/jarvis.db
productivity:
  catch_up_on_start: true
  scheduler_interval: 15
  quiet_hours: ''
voice:
  enabled: true
  wake_word: jarvis
  engine: auto
  porcupine_access_key: ''
  porcupine_keyword: jarvis
  sensitivity: 0.6
  interrupt: true
  chime: true
  stream_speech: true
  conversation_mode: true
  conversation_timeout: 20
  openwakeword:
    model: hey_jarvis
    threshold: 0.5
    inference_framework: onnx
  stt:
    model: base.en
    device: auto
    compute_type: auto
    language: auto
    beam_size: 1
    vad_filter: true
  tts:
    engine: auto
    piper_voice: ''
    piper_speed: 1.0
    voice: ''
    rate: +8%
    volume: +0%
    pitch: +0Hz
    cache: true
  vad:
    sample_rate: 16000
    frame_ms: 30
    energy_threshold: 0.014
    silence_ms: 900
    min_speech_ms: 250
    max_command_seconds: 15
    listen_timeout: 8
modules:
  system_control: true
  web_search: true
  productivity: true
  code_assistant: true
  file_manager: true
  smart_assistant: true
  knowledge: true
  vision: true
  communications: true
  models: true
  self_improve: true
knowledge:
  paths:
  - ~/Documents
  store_path: data/knowledge
  collection: jarvis_documents
  chunk_size: 1200
  chunk_overlap: 150
  max_file_mb: 25
  max_files: 5000
  top_k: 5
  min_relevance: 0.05
  auto_index_on_start: false
vision:
  model: llava
  fallback_models:
  - llava:7b
  - bakllava
  - moondream
  - llama3.2-vision
  max_tokens: 400
  temperature: 0.2
email:
  enabled: false
  imap_host: ''
  imap_port: 993
  smtp_host: ''
  smtp_port: 587
  user: ''
  password_env: JARVIS_EMAIL_PASSWORD
  mailbox: INBOX
  fetch_limit: 10
  allow_send: false
calendar:
  enabled: true
  files: []
  urls: []
  local_file: data/jarvis.ics
  look_ahead_days: 7
self_improve:
  enabled: true
  allow_code_edit: true
  allow_plugin_install: true
  review_plugins: true
  allow_pip_install: false
  run_tests_after_edit: true
  test_command: tests/test_smoke.py
  test_timeout: 900
  git_commit: true
  auto_reload: true
  plugins_dir: plugins
  repos_dir: data/repos
  backup_dir: data/backups
  keep_backups: 40
  max_file_bytes: 400000
  max_search_results: 8
  github_token_env: GITHUB_TOKEN
  protected:
  - utils/security.py
  - modules/self_improve.py
  - config.yaml
web_ui:
  enabled: false
  host: 0.0.0.0
  port: 8765
  token: ''
  require_token: true
  rate_limit_per_minute: 40
  allow_tts: true
  max_audio_mb: 25
  title: JARVIS
security:
  confirm_dangerous: true
  allow_shell: true
  shell_timeout: 60
  sandbox_timeout: 20
  blocked_patterns: []
  allowed_roots: []
web:
  max_results: 5
  timeout: 20
  scrape_chars: 6000
  user_agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/125.0 Safari/537.36
  news_feeds:
  - http://feeds.bbci.co.uk/news/world/rss.xml
  - https://feeds.arstechnica.com/arstechnica/index
  - https://hnrss.org/frontpage
  cache_ttl: 900
  cache_path: data/cache.db
paths:
  data: data
  logs: logs
  notes: data/notes
  code: data/code
  screenshots: data/screenshots
  downloads: data/downloads
  tts_cache: data/tts
  knowledge: data/knowledge
logging:
  level: INFO
  file: logs/jarvis.log
  max_bytes: 2000000
  backups: 3
  color: true
  quiet_libraries: true
blender:
  executable: ''
