# /pyproject.toml
# Packaging metadata. Installing the project is optional — `python main.py`
# always works — but `pip install -e .` gives you a global `jarvis` command.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "1.2.0"
description = "A 100% free, fully local JARVIS-style personal AI assistant (Ollama + Whisper + Edge-TTS + ChromaDB)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "JARVIS project" }]
keywords = ["assistant", "ollama", "whisper", "voice", "local-ai", "rag", "jarvis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core install stays small: everything heavy is optional.
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
    "psutil>=5.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Everything the full assistant uses, minus the audio stack.
core = [
    "chromadb>=0.5",
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pandas>=2.0",
]
voice = [
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "webrtcvad>=2.0.10",
    "pvporcupine>=3.0",
    "openwakeword>=0.6",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
vision = [
    "pillow>=10.0",
]
all = [
    "jarvis-local[core,voice,web,vision]",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/thijsgroenewegentg-cell/1"
Issues = "https://github.com/thijsgroenewegentg-cell/1/issues"

[project.scripts]
jarvis = "main:main"

[tool.setuptools]
# A flat layout of top-level packages plus the single-module entry point.
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "interfaces*", "modules*", "utils*"]
exclude = ["tests*", "data*", "logs*", "scripts*"]

[tool.setuptools.package-data]
# app.html is the browser interface, not an optional extra: without it the
# web UI falls back to a bare form.
"*" = ["*.yaml", "*.yml", "*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "data", "plugins", "backups", "logs"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "B",      # bugbear: likely bugs
    "C4",     # comprehension clean-ups
    "UP",     # outdated syntax
    "SIM",    # simplifiable code
    "RUF",    # ruff's own checks
    "D",      # docstrings: every public thing is documented
    "ANN",    # type annotations
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # Any is deliberate at the module/tool boundary
    "B008",    # FastAPI's Depends()/Query() defaults
    "SIM105",  # contextlib.suppress is not always clearer
    "RUF001",  # typographic characters (× – ›) are deliberate in user-facing text
    # JARVIS still runs on Python 3.9, and FastAPI/dataclasses evaluate
    # annotations at runtime, where `list[str]` and `int | None` would raise.
    # Do not "modernise" these until the floor moves to 3.10.
    "UP006",   # List[...] rather than list[...]
    "UP007",   # Optional[x] rather than x | None
    "UP035",   # typing.List import
    "UP037",   # quoted annotations (needed for forward references on 3.9)
    "UP045",   # Optional[x] rather than x | None
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "ANN001", "ANN201", "E501"]
# The web interface embeds HTML, CSS and JavaScript as string constants;
# rewrapping those lines would hurt rather than help readability.
"interfaces/web.py" = ["E501"]
"install.py" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# No python_version pin: recent mypy refuses to target 3.9, and the source is
# written so that it type-checks the same on 3.9 and 3.12.
files = ["core", "utils", "modules", "interfaces", "main.py"]
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = "(^|/)(\\.venv|data|plugins|backups)/"

[[tool.mypy.overrides]]
# The strict core: everything the rest of JARVIS is built on.
module = ["core.*", "utils.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the whole assistant against a mock Ollama server",
]

[tool.coverage.run]
branch = true
parallel = true
source = ["core", "interfaces", "modules", "utils"]
omit = ["*/__pycache__/*", "data/*", "plugins/*"]

[tool.coverage.report]
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
